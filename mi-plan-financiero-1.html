<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Plan">
<meta name="theme-color" content="#6b5b95">
<title>Mi Plan Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #f5f2f8; overscroll-behavior: none; }
  body { font-family: 'Jost', sans-serif; color: #2d2438; max-width: 480px; margin: 0 auto; position: relative; }
  .serif { font-family: 'Playfair Display', Georgia, serif; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: opacity(0.35); cursor: pointer; }
  input, button, select { font-family: inherit; }
  select { -webkit-appearance: none; appearance: none; }

  /* Layout */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  #header { background: #6b5b95; padding: 36px 24px 28px; position: relative; overflow: hidden; flex-shrink: 0; }
  #header::before { content:''; position:absolute; top:-50px; right:-50px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,0.06); }
  #header::after  { content:''; position:absolute; top:20px; right:20px; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,0.04); }
  #header .tag  { font-size:10px; letter-spacing:5px; color:#d4cce8; text-transform:uppercase; opacity:.8; margin-bottom:10px; }
  #header .title { font-family:'Playfair Display',serif; font-size:30px; font-weight:400; color:#fff; line-height:1.15; margin-bottom:8px; }
  #header .sub  { font-size:12px; color:#d4cce8; font-weight:300; letter-spacing:.5px; opacity:.85; }
  #header .sub span { color:#fff; font-weight:500; }

  #content { flex:1; overflow-y:auto; padding-bottom:90px; }
  #nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:rgba(245,242,248,0.97); backdrop-filter:blur(18px); border-top:1px solid #e2dced; display:flex; padding:10px 0 max(18px, env(safe-area-inset-bottom)); z-index:50; }
  .nav-btn { flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:#b0a8c0; transition:color .2s; }
  .nav-btn.active { color:#6b5b95; }
  .nav-btn .icon { font-size:16px; line-height:1; }
  .nav-btn .lbl  { font-size:9px; letter-spacing:2px; text-transform:uppercase; font-weight:300; }
  .nav-btn.active .lbl { font-weight:500; }
  .nav-dot { width:18px; height:2px; background:#6b5b95; border-radius:1px; margin-top:1px; display:none; }
  .nav-btn.active .nav-dot { display:block; }

  /* Pages */
  .page { padding:22px 18px; display:flex; flex-direction:column; gap:14px; animation: up .28s ease; }
  @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

  /* Cards */
  .card { background:#fff; border-radius:16px; border:1px solid #e2dced; padding:20px; box-shadow:0 2px 14px rgba(107,91,149,0.06); }
  .card-nude { background:#f9f6f0; border-radius:20px; border:1px solid #e8d8c4; padding:24px 22px; box-shadow:0 4px 24px rgba(107,91,149,0.08); position:relative; overflow:hidden; }

  /* Typography helpers */
  .sec-label { font-size:10px; letter-spacing:3.5px; text-transform:uppercase; color:#b0a8c0; margin-bottom:12px; }
  .pill { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; border-radius:20px; padding:3px 10px; display:inline-block; }
  .pill-lav { background:#d4cce8; color:#6b5b95; }
  .pill-coral { background:#f0d0d0; color:#c47070; }

  /* Bar */
  .bar-wrap { height:4px; background:#ede8f4; border-radius:4px; overflow:hidden; }
  .bar-fill  { height:100%; border-radius:4px; transition:width .6s cubic-bezier(.4,0,.2,1); }

  /* Buttons */
  .btn-main { border:none; border-radius:14px; padding:15px; color:#fff; font-size:14px; cursor:pointer; letter-spacing:1px; width:100%; transition:opacity .14s, transform .14s; }
  .btn-main:active { transform:scale(.97); opacity:.9; }
  .btn-lav   { background:#6b5b95; box-shadow:0 4px 16px rgba(107,91,149,0.3); }
  .btn-nude  { background:#c4a882; box-shadow:0 4px 16px rgba(196,168,130,0.3); }
  .btn-sage  { background:#7a9478; box-shadow:0 4px 16px rgba(122,148,120,0.3); }
  .btn-dark  { background:#2d2438; box-shadow:0 4px 16px rgba(45,36,56,0.25); }
  .btn-grad  { background:linear-gradient(135deg,#6b5b95,#5a4a80); box-shadow:0 4px 16px rgba(107,91,149,0.3); }
  .btn-outline { background:transparent; border:1px solid #7a9478; border-radius:10px; padding:11px; color:#7a9478; font-size:13px; cursor:pointer; width:100%; letter-spacing:.5px; transition:opacity .14s; }
  .btn-outline:active { opacity:.7; }
  .btn-ghost  { background:transparent; border:1px solid #e2dced; border-radius:14px; padding:14px; color:#b0a8c0; font-size:13px; cursor:pointer; width:100%; letter-spacing:.5px; }

  /* Grid 2 col */
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Row flex */
  .row { display:flex; justify-content:space-between; align-items:center; }

  /* Toast */
  #toast { position:fixed; top:22px; left:50%; transform:translateX(-50%); padding:9px 22px; border-radius:30px; font-size:13px; letter-spacing:.4px; z-index:999; box-shadow:0 6px 28px rgba(107,91,149,0.25); white-space:nowrap; display:none; animation:tin .22s ease; color:#fff; }
  @keyframes tin { from { opacity:0; transform:translateX(-50%) translateY(-8px) scale(.96); } to { opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }

  /* Deuda card */
  .deuda-card { background:#f9f6f0; border-radius:20px; border:1px solid #e8d8c4; padding:24px 22px; box-shadow:0 4px 24px rgba(107,91,149,0.08); position:relative; overflow:hidden; }
  .deuda-card::after { content:''; position:absolute; bottom:-20px; right:-20px; width:100px; height:100px; border-radius:50%; background:#f5ede0; }

  /* Stats row */
  .stats3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .stat-box { background:#f5f2f8; border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-lbl { font-size:9px; color:#b0a8c0; text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; }

  /* Ahorro hero */
  .ahorro-hero { background:linear-gradient(135deg,#6b5b95,#5a4a80); border-radius:20px; padding:24px 22px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 6px 24px rgba(107,91,149,0.3); }

  /* Cat item */
  .cat-item { background:#fff; border-radius:14px; border:1px solid #e2dced; padding:16px 18px; box-shadow:0 1px 8px rgba(107,91,149,0.05); }
  .cat-item.sobre { border-color:#f0d0d0; }
  .cat-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cat-name { display:flex; align-items:center; gap:9px; }
  .gasto-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid #e2dced; }

  /* Historial item */
  .hist-item { background:#fff; border-radius:12px; padding:14px 18px; border:1px solid #e2dced; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 6px rgba(107,91,149,0.05); }
  .del-btn { background:none; border:1px solid #e2dced; border-radius:8px; padding:4px 10px; color:#b0a8c0; font-size:12px; cursor:pointer; }

  /* Proyección */
  .proy-row { display:flex; justify-content:space-between; padding:10px 16px; font-size:12px; }
  .proy-row:not(:last-child) { border-bottom:1px solid #e2dced; }

  /* Modal */
  #modal-overlay { position:fixed; inset:0; background:rgba(45,36,56,0.5); display:none; align-items:flex-end; z-index:100; backdrop-filter:blur(6px); }
  #modal-overlay.open { display:flex; }
  #modal-box { background:#fff; border-radius:24px 24px 0 0; padding:28px 24px 48px; width:100%; max-width:480px; margin:0 auto; box-shadow:0 -8px 48px rgba(107,91,149,0.2); animation:up .28s ease; }
  .modal-handle { width:36px; height:3px; background:#d4cce8; border-radius:2px; margin:0 auto 24px; }
  .field-label { font-size:10px; letter-spacing:3px; color:#b0a8c0; text-transform:uppercase; margin-bottom:8px; }
  .field-input { width:100%; background:#f5f2f8; border:1px solid #c8bedd; border-radius:12px; padding:14px 18px; color:#2d2438; font-size:28px; outline:none; font-family:'Playfair Display',serif; }
  .field-text  { width:100%; background:#f5f2f8; border:1px solid #e2dced; border-radius:12px; padding:12px 16px; color:#2d2438; font-size:14px; outline:none; }
  .field-date  { width:100%; background:#f5f2f8; border:1px solid #e2dced; border-radius:12px; padding:12px 16px; color:#2d2438; font-size:14px; outline:none; }
  .cat-chips   { display:flex; flex-wrap:wrap; gap:7px; }
  .cat-chip    { border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; letter-spacing:.3px; border:1px solid #e2dced; background:transparent; color:#7a6e8a; transition:all .15s; }
  .cat-chip.sel { color:#fff; }

  /* Ajustes inputs */
  .aj-input { width:100%; background:#f5f2f8; border:1px solid #e2dced; border-radius:10px; padding:12px 16px; font-size:24px; outline:none; font-family:'Playfair Display',serif; }
  .presup-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .presup-input { width:110px; background:#f5f2f8; border:1px solid #e2dced; border-radius:8px; padding:7px 10px; font-size:15px; outline:none; text-align:right; font-family:'Playfair Display',serif; }

  /* Hint bar */
  .hint { background:#d4cce8; border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px; margin-top:14px; }
  .hint-dot { width:6px; height:6px; border-radius:50%; background:#6b5b95; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="tag">BancoEstado · Smart Visa</div>
    <div class="title">Mi Plan<br><em>Financiero</em></div>
    <div class="sub" id="header-sub">Desde mayo 2025</div>
  </div>
  <div id="content"></div>
  <div id="nav"></div>
</div>

<div id="toast"></div>

<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<script>
// ── Constantes ────────────────────────────────────────────────
const DEUDA_INICIAL = 2362792;
const TASA = 0.0199;
const KEY = 'plan-fin-html-v1';
const MES_INICIO = '2025-05';

const CATS = [
  { key:'vivienda',     label:'Vivienda',     icon:'🏠', color:'#7c6fa0', presup:440000 },
  { key:'alimentacion', label:'Alimentación', icon:'🛒', color:'#a08060', presup:200000 },
  { key:'transporte',   label:'Transporte',   icon:'🚌', color:'#808898', presup:2000   },
  { key:'servicios',    label:'Servicios',    icon:'💡', color:'#7a9478', presup:80000  },
  { key:'salud',        label:'Salud',        icon:'❤️', color:'#b07090', presup:30000  },
  { key:'entretencion', label:'Entretención', icon:'🎬', color:'#9070b0', presup:20000  },
  { key:'ejercicio',    label:'Ejercicio',    icon:'🏋️', color:'#7a9478', presup:130000 },
  { key:'imprevistos',  label:'Imprevistos',  icon:'⚡', color:'#c4956a', presup:50000  },
];

const TABS = [
  { key:'inicio',   label:'Inicio',   icon:'⊹' },
  { key:'gastos',   label:'Gastos',   icon:'⊶' },
  { key:'deuda',    label:'Deuda',    icon:'⊛' },
  { key:'ahorro',   label:'Ahorro',   icon:'⊜' },
  { key:'invertir', label:'Invertir', icon:'◇' },
  { key:'ajustes',  label:'Ajustes',  icon:'⊞' },
];

// ── Estado ────────────────────────────────────────────────────
let state = {
  sueldo: 1700000,
  ingresosExtra: [],
  gastos: [],
  pagosDeuda: [],
  registrosAhorro: [],
  pagoObjetivo: 440000,
  ahorroObjetivo: 358000,
  saldoDeudaManual: null,
  presupuestos: Object.fromEntries(CATS.map(c => [c.key, c.presup])),
};
let tab = 'inicio';
let filtroMes = MES_INICIO;
let modalTipo = null;
let formData = { monto:'', descripcion:'', fecha: MES_INICIO+'-01', categoria:'alimentacion' };

// ── Persistencia ──────────────────────────────────────────────
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch(e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}

// ── Helpers ───────────────────────────────────────────────────
function fmt(n) {
  if (!n && n !== 0) return '$0';
  return '$' + Math.round(n).toLocaleString('es-CL');
}

function calcPlan(saldo, pago) {
  let s = saldo; const ms = [];
  while (s > 0 && ms.length < 120) {
    const i = s * TASA;
    if (pago <= i) break;
    const k = Math.min(pago - i, s);
    s = Math.max(0, s - k);
    ms.push({ mes: ms.length+1, capital:Math.round(k), interes:Math.round(i), saldo:Math.round(s), pago:Math.round(k+i) });
  }
  return { meses:ms, totalInt:Math.round(ms.reduce((a,m)=>a+m.interes,0)), cuotas:ms.length };
}

function getMesRel(f) {
  const [y,m] = f.split('-').map(Number);
  const [iy,im] = MES_INICIO.split('-').map(Number);
  return (y-iy)*12+(m-im)+1;
}

function mesLabel(m) {
  const [y,mo] = m.split('-');
  return new Date(+y,+mo-1).toLocaleDateString('es-CL',{month:'long',year:'numeric'});
}

function mesesDisp() {
  const set = new Set([
    ...state.gastos.map(g=>g.fecha.slice(0,7)),
    ...state.ingresosExtra.map(e=>e.fecha.slice(0,7)),
    MES_INICIO,
  ]);
  return [...set].sort().reverse();
}

// ── Derivados ─────────────────────────────────────────────────
function derived() {
  const totalPagado   = state.pagosDeuda.reduce((s,p)=>s+p.monto,0);
  const totalAhorrado = state.registrosAhorro.reduce((s,p)=>s+p.monto,0);
  const saldoDeuda    = Math.max(0,(state.saldoDeudaManual??DEUDA_INICIAL)-totalPagado);
  const mesActual     = state.pagosDeuda.length+1;
  const plan          = calcPlan(saldoDeuda, state.pagoObjetivo);
  const pctPagado     = Math.min(100,Math.round(((DEUDA_INICIAL-saldoDeuda)/DEUDA_INICIAL)*100));
  const extraMes      = state.ingresosExtra.filter(e=>e.fecha.slice(0,7)===filtroMes).reduce((s,e)=>s+e.monto,0);
  const ingresos      = state.sueldo+extraMes;
  const gastosMes     = state.gastos.filter(g=>g.fecha.slice(0,7)===filtroMes);
  const porCat        = Object.fromEntries(CATS.map(c=>[c.key,gastosMes.filter(g=>g.categoria===c.key).reduce((s,g)=>s+g.monto,0)]));
  const totalGastos   = Object.values(porCat).reduce((s,v)=>s+v,0);
  const totalPresup   = Object.values(state.presupuestos||{}).reduce((s,v)=>s+v,0);
  const disponible    = ingresos-totalPresup;
  const deudaMes      = state.pagosDeuda.filter(p=>p.fecha.slice(0,7)===filtroMes).reduce((s,p)=>s+p.monto,0);
  const ahorroMes     = state.registrosAhorro.filter(r=>r.fecha.slice(0,7)===filtroMes).reduce((s,r)=>s+r.monto,0);
  return { totalPagado,totalAhorrado,saldoDeuda,mesActual,plan,pctPagado,extraMes,ingresos,gastosMes,porCat,totalGastos,totalPresup,disponible,deudaMes,ahorroMes };
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? '#6b5b95' : '#c47070';
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2400);
}

// ── Render NAV ────────────────────────────────────────────────
function renderNav() {
  document.getElementById('nav').innerHTML = TABS.map(t => `
    <button class="nav-btn ${tab===t.key?'active':''}" onclick="setTab('${t.key}')">
      <span class="icon">${t.icon}</span>
      <span class="lbl">${t.label}</span>
      <div class="nav-dot"></div>
    </button>
  `).join('');
}

function setTab(t) {
  tab = t;
  render();
}

// ── Render HEADER ─────────────────────────────────────────────
function renderHeader() {
  const d = derived();
  const extra = d.extraMes > 0 ? ` <span style="color:#d4cce8">+ ${fmt(d.extraMes)}</span>` : '';
  document.getElementById('header-sub').innerHTML =
    `Desde mayo 2025 · Sueldo <span>${fmt(state.sueldo)}</span>${extra}`;
}

// ── Selector de mes ───────────────────────────────────────────
function mesSelect(id) {
  return `<select onchange="filtroMes=this.value;render()" style="background:transparent;border:1px solid #e2dced;border-radius:8px;padding:5px 10px;color:#7a6e8a;font-size:12px;outline:none;font-family:'Jost',sans-serif;">
    ${mesesDisp().map(m=>`<option value="${m}" ${m===filtroMes?'selected':''}>${mesLabel(m)}</option>`).join('')}
  </select>`;
}

// ── Barra de progreso ─────────────────────────────────────────
function bar(pct, color, h=4) {
  return `<div class="bar-wrap" style="height:${h}px"><div class="bar-fill" style="width:${Math.min(100,pct||0)}%;background:${color};height:${h}px"></div></div>`;
}

// ── PÁGINAS ───────────────────────────────────────────────────
function pageInicio() {
  const d = derived();
  const pctObj1 = Math.min(100,state.pagoObjetivo>0?Math.round((d.deudaMes/state.pagoObjetivo)*100):0);
  const pctObj2 = Math.min(100,state.ahorroObjetivo>0?Math.round((d.ahorroMes/state.ahorroObjetivo)*100):0);
  const ok1 = d.deudaMes>=state.pagoObjetivo, ok2 = d.ahorroMes>=state.ahorroObjetivo;
  const balColor = d.ingresos-d.totalGastos>=0?'#7a9478':'#c47070';
  const gastColor = d.totalGastos>d.totalPresup?'#c47070':'#c4a882';

  return `<div class="page">

    <div class="deuda-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
        <div>
          <div class="sec-label" style="margin-bottom:10px">Deuda actual</div>
          <div class="serif" style="font-size:36px;color:#6b5b95;line-height:1">${fmt(d.saldoDeuda)}</div>
          <div style="font-size:12px;color:#7a6e8a;margin-top:6px">${fmt(d.totalPagado)} pagado</div>
        </div>
        <span class="pill pill-lav">${d.pctPagado}% listo</span>
      </div>
      ${bar(d.pctPagado,'#6b5b95',5)}
      ${d.plan.cuotas>0?`<div class="hint"><div class="hint-dot"></div><span style="font-size:13px;color:#6b5b95">Libre en <strong class="serif" style="font-size:16px">${d.plan.cuotas} ${d.plan.cuotas===1?'mes':'meses'}</strong></span></div>`:''}
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:16px">
        <div class="sec-label" style="margin-bottom:0">Este mes</div>
        ${mesSelect()}
      </div>
      <div class="stats3">
        <div class="stat-box"><div class="stat-lbl">Ingresos</div><div class="serif" style="font-size:14px;color:#7a9478">${fmt(d.ingresos)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Gastado</div><div class="serif" style="font-size:14px;color:${gastColor}">${fmt(d.totalGastos)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Balance</div><div class="serif" style="font-size:14px;color:${balColor}">${fmt(d.ingresos-d.totalGastos)}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="sec-label">Objetivos del mes</div>
      <div style="margin-bottom:16px">
        <div class="row" style="margin-bottom:8px">
          <span style="font-size:13px;color:#7a6e8a">Pago deuda</span>
          <span><span class="serif" style="font-size:16px;color:${ok1?'#7a9478':'#2d2438'}">${fmt(d.deudaMes)}</span><span style="font-size:11px;color:#b0a8c0"> / ${fmt(state.pagoObjetivo)}</span>${ok1?' <span style="color:#7a9478">✓</span>':''}</span>
        </div>
        ${bar(pctObj1,ok1?'#7a9478':'#6b5b95')}
      </div>
      <div>
        <div class="row" style="margin-bottom:8px">
          <span style="font-size:13px;color:#7a6e8a">Ahorro</span>
          <span><span class="serif" style="font-size:16px;color:${ok2?'#7a9478':'#2d2438'}">${fmt(d.ahorroMes)}</span><span style="font-size:11px;color:#b0a8c0"> / ${fmt(state.ahorroObjetivo)}</span>${ok2?' <span style="color:#7a9478">✓</span>':''}</span>
        </div>
        ${bar(pctObj2,ok2?'#7a9478':'#7a9478')}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(tipo) {
  modalTipo = tipo;
  formData = { monto:'', descripcion:'', fecha: filtroMes+'-01', categoria:'alimentacion' };
  renderModal();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>{ const el=document.querySelector('.field-input'); if(el) el.focus(); },100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  modalTipo = null;
}

function renderModal() {
  const titles = { gasto:'Registrar gasto', extra:'Ingreso extra', deuda:'Pago a deuda', ahorro:'Registrar ahorro' };
  const descLabels = { gasto:'Descripción', extra:'¿De dónde?', deuda:'Nota', ahorro:'Nota' };
  const descPlaceholders = { gasto:'Ej: Supermercado, delivery…', extra:'Ej: bono, trabajo extra…', deuda:'Ej: pago web BancoEstado', ahorro:'' };
  const btnBgs = { gasto:'#c4a882', extra:'#7a9478', deuda:'#6b5b95', ahorro:'linear-gradient(135deg,#6b5b95,#5a4a80)' };

  const chipsHtml = modalTipo==='gasto' ? `
    <div style="margin-bottom:16px">
      <div class="field-label">Categoría</div>
      <div class="cat-chips" id="chips">
        ${CATS.map(cat=>`<button class="cat-chip ${formData.categoria===cat.key?'sel':''}" style="${formData.categoria===cat.key?'background:'+cat.color+';border-color:'+cat.color:''}" onclick="selectCat('${cat.key}')">${cat.icon} ${cat.label}</button>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('modal-box').innerHTML = `
    <div class="modal-handle"></div>
    <div class="serif" style="font-size:24px;color:#2d2438;margin-bottom:22px;letter-spacing:.3px">${titles[modalTipo]}</div>
    ${chipsHtml}
    <div style="margin-bottom:14px">
      <div class="field-label">Monto</div>
      <input class="field-input" type="number" placeholder="0" value="${formData.monto}" oninput="formData.monto=this.value">
    </div>
    <div style="margin-bottom:14px">
      <div class="field-label">${descLabels[modalTipo]} <span style="opacity:.5">(opcional)</span></div>
      <input class="field-text" type="text" placeholder="${descPlaceholders[modalTipo]}" value="${formData.descripcion}" oninput="formData.descripcion=this.value">
    </div>
    <div style="margin-bottom:24px">
      <div class="field-label">Fecha</div>
      <input class="field-date" type="date" value="${formData.fecha}" oninput="formData.fecha=this.value">
    </div>
    <button class="btn-main" style="background:${btnBgs[modalTipo]}" onclick="registrar()">Guardar</button>
  `;
}

function selectCat(key) {
  formData.categoria = key;
  renderModal();
  setTimeout(()=>document.getElementById('modal-overlay').classList.add('open'),10);
}

function registrar() {
  const monto = parseInt(String(formData.monto).replace(/\D/g,''));
  if (!monto||monto<=0) { showToast('Ingresa un monto válido',false); return; }
  const id = Date.now();
  const fecha = formData.fecha || filtroMes+'-01';
  if (modalTipo==='gasto') {
    state.gastos.push({id,fecha,monto,categoria:formData.categoria,descripcion:formData.descripcion});
    showToast('Gasto registrado en '+CATS.find(c=>c.key===formData.categoria)?.label);
  } else if (modalTipo==='extra') {
    state.ingresosExtra.push({id,fecha,monto,descripcion:formData.descripcion});
    showToast('Ingreso extra registrado');
  } else if (modalTipo==='deuda') {
    state.pagosDeuda.push({id,fecha,monto,nota:formData.descripcion,mes:getMesRel(fecha.slice(0,7))});
    showToast('Pago a deuda registrado');
  } else if (modalTipo==='ahorro') {
    state.registrosAhorro.push({id,fecha,monto,nota:formData.descripcion});
    showToast('Ahorro registrado');
  }
  save(); closeModal(); render();
}

// ── Acciones ──────────────────────────────────────────────────
function del(lista, id) {
  state[lista] = state[lista].filter(x=>String(x.id)!==String(id));
  save(); render(); showToast('Eliminado',false);
}

function saveSueldo(v) {
  const n=parseInt(v); if(n>0){state.sueldo=n;save();renderHeader();showToast('Sueldo actualizado');}
}
function saveField(key,v) {
  const n=parseInt(v); if(!isNaN(n)&&n>0){state[key]=n;save();render();showToast('Guardado');}
}
function savePresup(key,v) {
  const n=parseInt(v); if(!isNaN(n)&&n>=0){state.presupuestos[key]=n;save();showToast('Guardado');}
}
function resetData() {
  if(confirm('¿Borrar todos los datos?')){
    state={sueldo:1700000,ingresosExtra:[],gastos:[],pagosDeuda:[],registrosAhorro:[],pagoObjetivo:440000,ahorroObjetivo:358000,saldoDeudaManual:null,presupuestos:Object.fromEntries(CATS.map(c=>[c.key,c.presup]))};
    save();render();showToast('Datos borrados',false);
  }
}

        ].map(p=>`
          <div style="background:#f5f2f8;border-radius:12px;padding:12px 8px;text-align:center">
            <div style="font-size:9px;color:#b0a8c0;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px">${p.yrs} anos</div>
            <div class="serif" style="font-size:14px;color:#7a9478">${fmt(Math.round(p.val))}</div>
          </div>`).join('')}
      </div>
      <div style="font-size:11px;color:#b0a8c0;text-align:center;margin-top:8px">Estimado con ~8% anual promedio. No garantizado.</div>
    </div>` : '';

  // Etapas progreso
  const etapasProgreso = [
    { key:'emergencia', label:'Emergencia', done: d.totalAhorrado>=300000 },
    { key:'pagando',    label:'Saldar deuda', done: deudaSaldada },
    { key:'libre',      label:'Invertir', done: false },
  ];

  const progresoHtml = `
    <div style="display:flex;align-items:center;gap:0;position:relative;margin-bottom:4px">
      <div style="position:absolute;top:50%;left:0;right:0;height:2px;background:#e2dced;z-index:0;transform:translateY(-50%)"></div>
      ${etapasProgreso.map((ep,i)=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1">
          <div style="width:32px;height:32px;border-radius:50%;background:${ep.done?'#7a9478':etapa===ep.key?e.color:'#e2dced'};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
            ${ep.done?'✓':i+1}
          </div>
          <div style="font-size:10px;color:${ep.done?'#7a9478':etapa===ep.key?e.color:'#b0a8c0'};margin-top:6px;text-align:center;letter-spacing:.5px">${ep.label}</div>
        </div>`).join('')}
    </div>`;

  return `<div class="page">

    <!-- Progreso etapas -->
    <div class="card">${progresoHtml}</div>

    <!-- Card etapa actual -->
    <div style="background:${e.bg};border-radius:20px;border:1px solid ${e.border};padding:22px 20px;box-shadow:0 4px 20px rgba(107,91,149,0.08)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div class="sec-label" style="margin-bottom:6px">Tu etapa actual</div>
          <div class="serif" style="font-size:20px;color:${e.color};line-height:1.2">${e.titulo}</div>
        </div>
        <div style="font-size:36px">${e.icono}</div>
      </div>
      <div style="font-size:13px;color:#7a6e8a;line-height:1.7;margin-bottom:${etapa==='emergencia'?'14px':'0'}">${e.descripcion}</div>
      ${etapa==='emergencia'?`
        <div class="sec-label" style="margin-top:4px;margin-bottom:8px">Progreso fondo emergencia</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${pctFondo}%;background:${e.color}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#b0a8c0;margin-top:6px">
          <span>${fmt(d.totalAhorrado)}</span><span>Meta: $300.000</span>
        </div>`:''}
    </div>

    <!-- Pasos -->
    <div class="card" style="padding:20px 20px 6px">
      <div class="sec-label">Qué hacer ahora</div>
      ${pasosHtml}
    </div>

    ${proyHtml}

    <!-- Disclaimer -->
    <div style="background:#f9f6f0;border-radius:12px;padding:14px 16px;border:1px solid #e8d8c4">
      <div style="font-size:12px;color:#b0a8c0;line-height:1.7">
        ⚠️ Esta información es orientativa y no reemplaza asesoría financiera profesional. Las rentabilidades pasadas no garantizan resultados futuros.
      </div>
    </div>

  </div>`;
}

// ── Render principal ──────────────────────────────────────────
function render() {
  renderHeader();
  renderNav();
  const pages = { inicio:pageInicio, gastos:pageGastos, deuda:pageDeuda, ahorro:pageAhorro, invertir:pageInvertir, ajustes:pageAjustes };
  document.getElementById('content').innerHTML = pages[tab]();
}

// ── Init ──────────────────────────────────────────────────────
document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

load();
render();
</script>
</body>
</html>
